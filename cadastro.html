<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta — Conta Onlinside</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #ffffff;
            color: #111111;

            font-family: "Garet", Arial, sans-serif;

            opacity: 0;
            transform: translateY(8px);

            animation:
                pageEnter
                0.55s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }

        @keyframes pageEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes elementEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 12px;

            font-size: 36px;
            letter-spacing: -1px;
        }

        .brand-conta {
            color: #ff9a30;
            font-weight: 400;
        }

        .brand-onlinside {
            color: #ff8200;
            font-weight: 800;
        }

        .title {
            text-align: center;

            font-size: 25px;
            margin-bottom: 8px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.08s
                forwards;
        }

        .description {
            text-align: center;

            color: #666666;

            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 28px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.12s
                forwards;
        }

        .form {
            display: flex;
            flex-direction: column;

            gap: 14px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.18s
                forwards;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .field {
            width: 100%;
        }

        .label {
            display: block;

            margin-bottom: 7px;

            color: #555555;

            font-size: 13px;
            font-weight: 600;
        }

        .input {
            width: 100%;
            height: 52px;

            padding: 0 15px;

            border: 1px solid #d8d8d8;
            border-radius: 10px;

            background: #ffffff;
            color: #111111;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input:focus {
            border-color: #ff8200;

            box-shadow:
                0 0 0 3px
                rgba(255, 130, 0, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .input {
            padding-right: 78px;
        }

        .show-password {
            position: absolute;

            top: 50%;
            right: 14px;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #777777;

            font-family: inherit;
            font-size: 12px;

            cursor: pointer;
        }

        .show-password:hover {
            color: #ff8200;
        }

        .terms {
            display: flex;
            align-items: flex-start;

            gap: 9px;

            margin-top: 2px;

            color: #666666;

            font-size: 12px;
            line-height: 1.45;
        }

        .terms input {
            margin-top: 2px;
        }

        .terms a {
            color: #ff8200;
            font-weight: 600;
            text-decoration: none;
        }

        .button {
            position: relative;

            width: 100%;
            height: 52px;

            margin-top: 4px;

            border: 0;
            border-radius: 10px;

            background: #ff8200;
            color: #ffffff;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .button:hover {
            background: #ff9a30;
            transform: translateY(-1px);
        }

        .button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        .spinner {
            position: absolute;

            width: 19px;
            height: 19px;

            border:
                2px solid
                rgba(255,255,255,.35);

            border-top-color: #ffffff;

            border-radius: 50%;

            opacity: 0;
            visibility: hidden;

            animation: none;
        }

        .button.loading .spinner {
            opacity: 1;
            visibility: visible;

            animation:
                spin
                .75s
                linear
                infinite;
        }

        .button.loading .button-text {
            opacity: 0;
        }

        .message {
            min-height: 20px;

            margin-top: 12px;

            text-align: center;

            color: #d00000;

            font-size: 13px;
        }

        .login-link {
            margin-top: 22px;

            text-align: center;

            color: #666666;

            font-size: 13px;
        }

        .login-link a {
            color: #111111;

            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            color: #ff8200;
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 18px;
            }

            .brand {
                font-size: 31px;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>


<body>

    <main class="container">

        <h1 class="brand">
            <span class="brand-conta">Conta</span>
            <span class="brand-onlinside">Onlinside</span>
        </h1>

        <h2 class="title">
            Crie sua conta
        </h2>

        <p class="description">
            Uma única conta para acessar todos os produtos Onlinside.
        </p>


        <form
            id="cadastroForm"
            class="form"
        >

            <div class="row">

                <div class="field">

                    <label
                        for="nome"
                        class="label"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="input"
                        autocomplete="given-name"
                        required
                    >

                </div>


                <div class="field">

                    <label
                        for="sobrenome"
                        class="label"
                    >
                        Sobrenome
                    </label>

                    <input
                        type="text"
                        id="sobrenome"
                        class="input"
                        autocomplete="family-name"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label
                    for="email"
                    class="label"
                >
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    class="input"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label
                    for="birthdate"
                    class="label"
                >
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="birthdate"
                    class="input"
                    autocomplete="bday"
                    required
                >

            </div>


            <div class="field">

                <label
                    for="senha"
                    class="label"
                >
                    Senha
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="senha"
                        class="input"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="senha"
                    >
                        Mostrar
                    </button>

                </div>

            </div>


            <div class="field">

                <label
                    for="confirmarSenha"
                    class="label"
                >
                    Confirmar senha
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmarSenha"
                        class="input"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmarSenha"
                    >
                        Mostrar
                    </button>

                </div>

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="termos"
                    required
                >

                <span>
                    Li e aceito os
                    <a href="#">Termos de Uso</a>
                    e a
                    <a href="#">Política de Privacidade</a>.
                </span>

            </label>


            <button
                type="submit"
                id="criarConta"
                class="button"
            >

                <span class="button-text">
                    Criar Conta Onlinside
                </span>

                <span class="spinner"></span>

            </button>

        </form>


        <p
            id="mensagem"
            class="message"
        ></p>


        <p class="login-link">

            Já possui uma conta?

            <a href="./index.html">
                Entrar
            </a>

        </p>

    </main>


    <script type="module">

        /* ========================================
           FIREBASE AUTH
        ======================================== */

        import { auth }
        from "./firebase.js";


        import {
            createUserWithEmailAndPassword,
            sendEmailVerification,
            updateProfile,
            deleteUser
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /* ========================================
           FIREBASE APP
        ======================================== */

        import {
            getApp
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        /* ========================================
           FIRESTORE
        ======================================== */

        import {
            getFirestore,
            doc,
            runTransaction,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /*
         * firebase.js já inicializou
         * o aplicativo Firebase.
         */

        const app =
            getApp();


        const db =
            getFirestore(
                app
            );


        /* ========================================
           ELEMENTOS
        ======================================== */

        const formulario =
            document.getElementById(
                "cadastroForm"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const criarContaButton =
            document.getElementById(
                "criarConta"
            );


        /* ========================================
           MOSTRAR / OCULTAR SENHA
        ======================================== */

        document
            .querySelectorAll(
                ".show-password"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const target =
                                document.getElementById(
                                    button.dataset.target
                                );


                            if (
                                target.type ===
                                "password"
                            ) {

                                target.type =
                                    "text";


                                button.textContent =
                                    "Ocultar";

                            } else {

                                target.type =
                                    "password";


                                button.textContent =
                                    "Mostrar";

                            }

                        }
                    );

                }
            );


        /* ========================================
           GERA ID PÚBLICO DE 4 DÍGITOS
        ======================================== */

        function gerarPublicId() {

            /*
             * Usa o gerador criptográfico
             * disponível no navegador.
             */

            const valores =
                new Uint32Array(1);


            crypto.getRandomValues(
                valores
            );


            /*
             * Resultado:
             *
             * 7    → "0007"
             * 82   → "0082"
             * 827  → "0827"
             * 4827 → "4827"
             */

            return String(
                valores[0] % 10000
            ).padStart(
                4,
                "0"
            );

        }


        /* ========================================
           RESERVA UM ID SEM REPETIÇÃO
        ======================================== */

        async function criarPerfilComPublicId(
            usuario,
            dados
        ) {

            /*
             * Tenta números diferentes
             * se ocorrer uma colisão.
             */

            const MAX_TENTATIVAS =
                50;


            for (
                let tentativa = 0;
                tentativa < MAX_TENTATIVAS;
                tentativa++
            ) {

                const publicId =
                    gerarPublicId();


                try {

                    await runTransaction(
                        db,
                        async function(transaction) {

                            /* =============================
                               DOCUMENTO DA RESERVA
                            ============================= */

                            const publicIdRef =
                                doc(
                                    db,
                                    "publicIds",
                                    publicId
                                );


                            const publicIdSnapshot =
                                await transaction.get(
                                    publicIdRef
                                );


                            /*
                             * Se já estiver ocupado,
                             * tenta outro número.
                             */

                            if (
                                publicIdSnapshot.exists()
                            ) {

                                throw new Error(
                                    "PUBLIC_ID_OCUPADO"
                                );

                            }


                            /* =============================
                               PERFIL DO USUÁRIO
                            ============================= */

                            const userRef =
                                doc(
                                    db,
                                    "users",
                                    usuario.uid
                                );


                            /*
                             * Reserva o número.
                             */

                            transaction.set(
                                publicIdRef,
                                {
                                    uid:
                                        usuario.uid
                                }
                            );


                            /*
                             * Cria o perfil.
                             */

                            transaction.set(
                                userRef,
                                {
                                    nome:
                                        dados.nome,

                                    sobrenome:
                                        dados.sobrenome,

                                    nomeCompleto:
                                        dados.nome +
                                        " " +
                                        dados.sobrenome,

                                    email:
                                        usuario.email,

                                    dataNascimento:
                                        dados.birthdate,

                                    publicId:
                                        publicId,

                                    criadoEm:
                                        serverTimestamp()
                                }
                            );

                        }
                    );


                    /*
                     * Se chegou aqui,
                     * o ID foi reservado.
                     */

                    return publicId;


                } catch (erro) {

                    if (
                        erro.message ===
                        "PUBLIC_ID_OCUPADO"
                    ) {

                        /*
                         * Colisão normal.
                         * Tenta novamente.
                         */

                        continue;

                    }


                    /*
                     * Qualquer outro erro
                     * precisa interromper.
                     */

                    throw erro;

                }

            }


            throw new Error(
                "PUBLIC_ID_INDISPONIVEL"
            );

        }


        /* ========================================
           CADASTRO
        ======================================== */

        formulario.addEventListener(
            "submit",
            async function(evento) {

                evento.preventDefault();


                mensagem.textContent =
                    "";


                /* =================================
                   DADOS
                ================================= */

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const sobrenome =
                    document
                        .getElementById("sobrenome")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const birthdate =
                    document
                        .getElementById("birthdate")
                        .value;


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                const confirmarSenha =
                    document
                        .getElementById(
                            "confirmarSenha"
                        )
                        .value;


                /* =================================
                   SENHAS
                ================================= */

                if (
                    senha !==
                    confirmarSenha
                ) {

                    mensagem.textContent =
                        "As senhas não coincidem.";


                    return;

                }


                /* =================================
                   NASCIMENTO
                ================================= */

                if (!birthdate) {

                    mensagem.textContent =
                        "Informe sua data de nascimento.";


                    return;

                }


                const hoje =
                    new Date();


                const nascimento =
                    new Date(
                        birthdate +
                        "T12:00:00"
                    );


                if (
                    nascimento >
                    hoje
                ) {

                    mensagem.textContent =
                        "A data de nascimento não pode estar no futuro.";


                    return;

                }


                /* =================================
                   LOADING
                ================================= */

                criarContaButton
                    .classList
                    .add(
                        "loading"
                    );


                criarContaButton.disabled =
                    true;


                let resultado = null;


                try {

                    /* =================================
                       1. CRIA CONTA FIREBASE
                    ================================= */

                    resultado =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const usuario =
                        resultado.user;


                    /* =================================
                       2. RESERVA O ID ONLINSIDE
                    ================================= */

                    let publicId;


                    try {

                        publicId =
                            await criarPerfilComPublicId(
                                usuario,
                                {
                                    nome:
                                        nome,

                                    sobrenome:
                                        sobrenome,

                                    birthdate:
                                        birthdate
                                }
                            );


                    } catch (erroFirestore) {

                        console.error(
                            "Erro ao criar perfil:",
                            erroFirestore
                        );


                        /*
                         * Se não conseguimos criar
                         * o perfil/ID, removemos a
                         * conta recém-criada para
                         * não deixar cadastro incompleto.
                         */

                        try {

                            await deleteUser(
                                usuario
                            );

                        } catch (erroDelete) {

                            console.error(
                                "Não foi possível desfazer a conta:",
                                erroDelete
                            );

                        }


                        throw new Error(
                            "ERRO_AO_CRIAR_ID"
                        );

                    }


                    /* =================================
                       3. NOME NO FIREBASE AUTH
                    ================================= */

                    await updateProfile(
                        usuario,
                        {
                            displayName:
                                nome +
                                " " +
                                sobrenome
                        }
                    );


                    /* =================================
                       4. GUARDA DADOS LOCAIS
                    ================================= */

                    localStorage.setItem(
                        "onlinside_birthdate",
                        birthdate
                    );


                    localStorage.setItem(
                        "onlinside_nome",
                        nome
                    );


                    localStorage.setItem(
                        "onlinside_public_id",
                        publicId
                    );


                    /* =================================
                       5. ENVIA CONFIRMAÇÃO
                    ================================= */

                    await sendEmailVerification(
                        usuario
                    );


                    /* =================================
                       6. VAI PARA CONFIRMAÇÃO
                    ================================= */

                    window.location.href =
                        "./confirmar-email.html";


                } catch (erro) {

                    console.error(
                        "Erro no cadastro:",
                        erro
                    );


                    criarContaButton
                        .classList
                        .remove(
                            "loading"
                        );


                    criarContaButton.disabled =
                        false;


                    /* =================================
                       MENSAGENS
                    ================================= */

                    if (
                        erro.code ===
                        "auth/email-already-in-use"
                    ) {

                        mensagem.textContent =
                            "Este e-mail já está cadastrado.";


                    } else if (
                        erro.code ===
                        "auth/invalid-email"
                    ) {

                        mensagem.textContent =
                            "Digite um e-mail válido.";


                    } else if (
                        erro.code ===
                        "auth/weak-password"
                    ) {

                        mensagem.textContent =
                            "Escolha uma senha mais forte.";


                    } else if (
                        erro.message ===
                        "ERRO_AO_CRIAR_ID"
                    ) {

                        mensagem.textContent =
                            "Não foi possível gerar seu ID Onlinside. Tente novamente.";


                    } else {

                        mensagem.textContent =
                            "Não foi possível criar sua conta.";

                    }

                }

            }
        );

    </script>

</body>

</html>
