<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
</head>

<body>

    <h1>Criar conta</h1>

    <form id="cadastroForm">

        <input
            type="email"
            id="email"
            placeholder="Seu e-mail"
            required
        >

        <br><br>

        <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            minlength="6"
            required
        >

        <br><br>

        <button type="submit">Criar conta</button>

    </form>

    <p id="mensagem"></p>

    <p>
        Já tem uma conta?
        <a href="index.html">Fazer login</a>
    </p>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            sendEmailVerification
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


       const firebaseConfig = {
  apiKey: "AIzaSyCUZ98Y78ZxCU166qC5EAAupCDPbv0aF9U",
  authDomain: "login-4e334.firebaseapp.com",
  projectId: "login-4e334",
  storageBucket: "login-4e334.firebasestorage.app",
  messagingSenderId: "937085407465",
  appId: "1:937085407465:web:c93de7f716be2480c2a078",
  measurementId: "G-MNNYF7GEN1"
       
 };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const formulario = document.getElementById("cadastroForm");

        const mensagem = document.getElementById("mensagem");


        formulario.addEventListener("submit", async (evento) => {

            evento.preventDefault();

            const email = document.getElementById("email").value;

            const senha = document.getElementById("senha").value;


            try {

                const resultado = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    senha
                );


                await sendEmailVerification(resultado.user);


                mensagem.textContent =
                    "Conta criada! Verifique seu e-mail para ativar a conta.";

                formulario.reset();


            } catch (erro) {

                console.error(erro);


                if (erro.code === "auth/email-already-in-use") {

                    mensagem.textContent =
                        "Este e-mail já está cadastrado.";

                } else if (erro.code === "auth/invalid-email") {

                    mensagem.textContent =
                        "Digite um e-mail válido.";

                } else if (erro.code === "auth/weak-password") {

                    mensagem.textContent =
                        "A senha precisa ter pelo menos 6 caracteres.";

                } else {

                    mensagem.textContent =
                        "Erro ao criar a conta: " + erro.message;

                }

            }

        });

    </script>

</body>
</html>
