<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar — Conta Onlinside</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #ffffff;

            color: #111111;

            font-family:
                "Garet",
                Arial,
                sans-serif;

            opacity: 0;

            transform:
                translateY(8px);

            animation:
                pageEnter
                0.55s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* =========================
           ANIMAÇÕES
        ========================= */

        @keyframes pageEnter {

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        body.page-exit {

            animation:
                pageExit
                0.35s
                cubic-bezier(.4, 0, 1, 1)
                forwards;
        }


        @keyframes pageExit {

            to {
                opacity: 0;
                transform:
                    translateY(-8px);
            }

        }


        @keyframes elementEnter {

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }


        @keyframes fadeIn {

            to {
                opacity: 1;
            }

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width:
                420px;

            text-align:
                center;
        }


        /* =========================
           LOGO
        ========================= */

        .brand {

            margin-bottom:
                14px;

            font-size:
                38px;

            line-height:
                1.1;

            letter-spacing:
                -1px;

            opacity:
                0;

            transform:
                translateY(12px);

            animation:
                elementEnter
                0.6s
                0.05s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        .brand-conta {

            color:
                #ff9a30;

            font-weight:
                400;
        }


        .brand-onlinside {

            color:
                #ff8200;

            font-weight:
                800;
        }


        /* =========================
           E-MAIL
        ========================= */

        .email {

            margin-bottom:
                28px;

            color:
                #666666;

            font-size:
                14px;

            opacity:
                0;

            transform:
                translateY(8px);

            animation:
                elementEnter
                0.6s
                0.12s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* =========================
           ÁREA DA SENHA
        ========================= */

        .password-wrapper {

            position:
                relative;
        }


        .input {

            display:
                block;

            width:
                100%;

            height:
                52px;

            padding:
                0 16px;

            border:
                1px solid #d8d8d8;

            border-radius:
                10px;

            background:
                #ffffff;

            color:
                #111111;

            font-family:
                inherit;

            font-size:
                15px;

            outline:
                none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        .input:hover {

            border-color:
                #bdbdbd;
        }


        .input:focus {

            border-color:
                #ff8200;

            box-shadow:
                0 0 0 3px
                rgba(255, 130, 0, 0.12);

            transform:
                translateY(-1px);
        }


        .password-wrapper
        .input {

            padding-right:
                75px;
        }


        /* =========================
           MOSTRAR SENHA
        ========================= */

        .show-password {

            position:
                absolute;

            top:
                50%;

            right:
                15px;

            transform:
                translateY(-50%);

            border:
                none;

            background:
                transparent;

            color:
                #777777;

            font-family:
                inherit;

            font-size:
                13px;

            cursor:
                pointer;

            transition:
                color 0.2s ease;
        }


        .show-password:hover {

            color:
                #ff8200;
        }


        /* =========================
           BOTÃO PRINCIPAL
        ========================= */

        .button {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            position:
                relative;

            width:
                100%;

            height:
                52px;

            margin-top:
                12px;

            border:
                none;

            border-radius:
                10px;

            background:
                #ff8200;

            color:
                #ffffff;

            font-family:
                inherit;

            font-size:
                15px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                opacity 0.18s ease;
        }


        .button:hover {

            background:
                #ff9a30;

            transform:
                translateY(-1px);
        }


        .button:active {

            transform:
                scale(0.98);
        }


        .button:disabled {

            cursor:
                default;

            opacity:
                0.7;
        }


        /* =========================
           LOADING
        ========================= */

        .button.loading {

            pointer-events:
                none;
        }


        .button.loading
        .button-text {

            opacity:
                0;
        }


        .spinner {

            position:
                absolute;

            width:
                19px;

            height:
                19px;

            border:
                2px solid
                rgba(255,255,255,.35);

            border-top-color:
                #ffffff;

            border-radius:
                50%;

            opacity:
                0;

            animation:
                spinnerAppear
                0.2s
                forwards,

                spin
                0.75s
                linear
                infinite;
        }


        .button.loading
        .spinner {

            opacity:
                1;
        }


        @keyframes spinnerAppear {

            to {
                opacity:
                    1;
            }

        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =========================
           MENSAGEM
        ========================= */

        .message {

            min-height:
                20px;

            margin-top:
                12px;

            color:
                #d00000;

            font-size:
                13px;

            opacity:
                0;

            transform:
                translateY(-4px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .message.show {

            opacity:
                1;

            transform:
                translateY(0);
        }


        /* =========================
           OPÇÕES DE LOGIN
        ========================= */

        .login-options {

            margin-top:
                22px;

            opacity:
                0;

            animation:
                fadeIn
                0.5s
                0.25s
                forwards;
        }


        .option-button {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                9px;

            width:
                100%;

            height:
                46px;

            margin-top:
                10px;

            border:
                none;

            background:
                transparent;

            color:
                #111111;

            font-family:
                inherit;

            font-size:
                14px;

            font-weight:
                600;

            cursor:
                pointer;

            border-radius:
                9px;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .option-button:hover {

            background:
                #fff3e6;

            color:
                #ff8200;

            transform:
                translateY(-1px);
        }


        .option-icon {

            font-size:
                17px;

            line-height:
                1;
        }


        /* =========================
           ÁREA DO CÓDIGO
        ========================= */

        .code-section {

            display:
                none;

            margin-top:
                18px;

            opacity:
                0;

            transform:
                translateY(8px);
        }


        .code-section.active {

            display:
                block;

            animation:
                elementEnter
                0.35s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        .code-description {

            margin-bottom:
                14px;

            color:
                #666666;

            font-size:
                13px;

            line-height:
                1.5;
        }


        .code-input {

            width:
                100%;

            height:
                58px;

            border:
                1px solid #d8d8d8;

            border-radius:
                10px;

            text-align:
                center;

            letter-spacing:
                8px;

            font-size:
                22px;

            font-weight:
                600;

            outline:
                none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .code-input:focus {

            border-color:
                #ff8200;

            box-shadow:
                0 0 0 3px
                rgba(255,130,0,.12);
        }


        /* =========================
           ESQUECI SENHA
        ========================= */

        .forgot-password {

            display:
                inline-block;

            margin-top:
                20px;

            color:
                #111111;

            font-size:
                14px;

            font-weight:
                600;

            text-decoration:
                none;

            transition:
                color 0.2s ease;
        }


        .forgot-password:hover {

            color:
                #ff8200;

            text-decoration:
                underline;
        }


        /* =========================
           VOLTAR
        ========================= */

        .back {

            display:
                block;

            margin-top:
                28px;

            color:
                #777777;

            font-size:
                13px;

            text-decoration:
                none;

            transition:
                color 0.2s ease;
        }


        .back:hover {

            color:
                #ff8200;
        }


        /* =========================
           CARREGAMENTO DA PÁGINA
        ========================= */

        .page-loader {

            position:
                fixed;

            inset:
                0;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            background:
                #ffffff;

            z-index:
                9999;

            pointer-events:
                none;

            animation:
                loaderOut
                0.35s
                0.45s
                forwards;
        }


        .loader-spinner {

            width:
                28px;

            height:
                28px;

            border:
                3px solid
                #eeeeee;

            border-top-color:
                #ff8200;

            border-radius:
                50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }


        @keyframes loaderOut {

            to {

                opacity:
                    0;

                visibility:
                    hidden;
            }

        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 480px) {

            body {

                padding:
                    20px 18px;
            }


            .brand {

                font-size:
                    32px;
            }

        }


        /* =========================
           ACESSIBILIDADE
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }

        }

    </style>

</head>


<body>


    <!-- CARREGAMENTO -->

    <div class="page-loader">

        <div class="loader-spinner"></div>

    </div>


    <main class="container">


        <!-- LOGO -->

        <h1 class="brand">

            <span class="brand-conta">
                Conta
            </span>

            <span class="brand-onlinside">
                Onlinside
            </span>

        </h1>


        <!-- E-MAIL -->

        <p
            id="emailDisplay"
            class="email"
        ></p>


        <!-- LOGIN POR SENHA -->

        <form id="passwordForm">


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    class="input"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    id="showPassword"
                    class="show-password"
                >
                    Mostrar
                </button>

            </div>


            <button
                type="submit"
                class="button"
                id="loginButton"
            >

                <span class="button-text">
                    Entrar
                </span>

                <span class="spinner"></span>

            </button>

        </form>


        <!-- MENSAGEM -->

        <p
            id="mensagem"
            class="message"
        ></p>


        <!-- OPÇÕES -->

        <div class="login-options">


            <!-- CÓDIGO -->

            <button
                type="button"
                class="option-button"
                id="codeButton"
            >

                <span class="option-icon">
                    🔢
                </span>

                Usar código de acesso

            </button>


            <!-- PASSKEY -->

            <button
                type="button"
                class="option-button"
                id="passkeyButton"
            >

                <span class="option-icon">
                    🔑
                </span>

                Usar chave de acesso

            </button>


        </div>


        <!-- ÁREA DO CÓDIGO -->

        <section
            id="codeSection"
            class="code-section"
        >

            <p class="code-description">

                Enviaremos um código de
                verificação para o seu e-mail.

            </p>


            <input
                type="text"
                id="accessCode"
                class="code-input"
                inputmode="numeric"
                maxlength="6"
                placeholder="000000"
                autocomplete="one-time-code"
            >


            <button
                type="button"
                id="verifyCodeButton"
                class="button"
            >

                <span class="button-text">
                    Verificar código
                </span>

                <span class="spinner"></span>

            </button>

        </section>


        <!-- RECUPERAÇÃO -->

        <a
            href="recuperar-senha.html"
            class="forgot-password"
        >

            Esqueci minha senha

        </a>


        <!-- VOLTAR -->

        <a
            href="index.html"
            class="back"
        >

            Voltar

        </a>

    </main>


    <!-- FIREBASE -->

    <script type="module">

        import { auth }
            from "./firebase.js";


        import {
            signInWithEmailAndPassword
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /* =========================
           ELEMENTOS
        ========================= */

        const email =
            localStorage.getItem(
                "onlinside_email"
            );


        const emailDisplay =
            document.getElementById(
                "emailDisplay"
            );


        const passwordForm =
            document.getElementById(
                "passwordForm"
            );


        const password =
            document.getElementById(
                "password"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const codeButton =
            document.getElementById(
                "codeButton"
            );


        const codeSection =
            document.getElementById(
                "codeSection"
            );


        const accessCode =
            document.getElementById(
                "accessCode"
            );


        const verifyCodeButton =
            document.getElementById(
                "verifyCodeButton"
            );


        /* =========================
           VERIFICA E-MAIL
        ========================= */

        if (!email) {

            window.location.href =
                "index.html";

        } else {

            emailDisplay.textContent =
                email;

        }


        /* =========================
           MOSTRAR SENHA
        ========================= */

        showPassword.addEventListener(
            "click",
            function () {

                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";

                    showPassword.textContent =
                        "Ocultar";

                } else {

                    password.type =
                        "password";

                    showPassword.textContent =
                        "Mostrar";

                }

            }
        );


        /* =========================
           LOGIN NORMAL
        ========================= */

        passwordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                mensagem.textContent =
                    "";

                mensagem.classList.remove(
                    "show"
                );


                loginButton.classList.add(
                    "loading"
                );


                loginButton.disabled =
                    true;


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password.value
                    );


                    document.body.classList.add(
                        "page-exit"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "minha-conta.html";

                        },
                        280
                    );


                } catch (error) {

                    console.error(error);


                    loginButton.classList.remove(
                        "loading"
                    );


                    loginButton.disabled =
                        false;


                    mensagem.textContent =
                        "E-mail ou senha incorretos.";


                    mensagem.classList.add(
                        "show"
                    );

                }

            }
        );


        /* =========================
           MOSTRAR CÓDIGO
        ========================= */

        codeButton.addEventListener(
            "click",
            function () {

                codeSection.classList.add(
                    "active"
                );


                codeButton.style.display =
                    "none";


                setTimeout(
                    function () {

                        accessCode.focus();

                    },
                    350
                );

            }
        );


        /* =========================
           SOMENTE NÚMEROS
        ========================= */

        accessCode.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

            }
        );


        /* =========================
           VERIFICAR CÓDIGO
        ========================= */

        verifyCodeButton.addEventListener(
            "click",
            function () {

                const code =
                    accessCode.value.trim();


                if (code.length !== 6) {

                    mensagem.textContent =
                        "Digite o código de 6 dígitos.";

                    mensagem.classList.add(
                        "show"
                    );

                    return;

                }


                /*
                 * Aqui entraremos com a
                 * verificação real do código.
                 *
                 * Não coloque um código fixo
                 * aqui, pois isso não seria seguro.
                 */

                mensagem.textContent =
                    "A verificação do código será configurada na próxima etapa.";

                mensagem.classList.add(
                    "show"
                );

            }
        );


        /* =========================
           CHAVE DE ACESSO
        ========================= */

        const passkeyButton =
            document.getElementById(
                "passkeyButton"
            );


        passkeyButton.addEventListener(
            "click",
            function () {

                mensagem.textContent =
                    "A chave de acesso será configurada na próxima etapa.";

                mensagem.classList.add(
                    "show"
                );

            }
        );

    </script>

</body>

</html>
