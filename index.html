<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conta Onlinside</title>

    <style>

        /* =========================================
           CONFIGURAÇÕES GERAIS
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #ffffff;
            color: #111111;

            font-family: "Garet", Arial, sans-serif;

            opacity: 0;
            transform: translateY(8px);

            animation:
                pageEnter
                0.55s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* =========================================
           ANIMAÇÕES GERAIS
        ========================================= */

        @keyframes pageEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.page-exit {
            animation:
                pageExit
                0.35s
                cubic-bezier(.4, 0, 1, 1)
                forwards;
        }

        @keyframes pageExit {
            to {
                opacity: 0;
                transform: translateY(-8px);
            }
        }

        @keyframes elementEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {
            width: 100%;
            max-width: 420px;

            text-align: center;
        }


        /* =========================================
           CONTA ONLINSIDE
        ========================================= */

        .brand {
            margin-bottom: 14px;

            font-size: 38px;
            line-height: 1.1;
            letter-spacing: -1px;

            opacity: 0;
            transform: translateY(12px);

            animation:
                elementEnter
                0.6s
                0.05s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }

        .brand-conta {
            color: #ff9a30;
            font-weight: 400;
        }

        .brand-onlinside {
            color: #ff8200;
            font-weight: 800;
        }


        /* =========================================
           DESCRIÇÃO
        ========================================= */

        .description {
            max-width: 330px;

            margin: 0 auto 17px;

            color: #555555;

            font-size: 15px;
            line-height: 1.5;

            opacity: 0;
            transform: translateY(10px);

            animation:
                elementEnter
                0.6s
                0.12s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* =========================================
           CARROSSEL DOS PRODUTOS
        ========================================= */

        .products-carousel {
            position: relative;

            width: 100%;

            overflow: hidden;

            margin: 0 auto 27px;

            padding: 8px 0;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.6s
                0.18s
                cubic-bezier(.22, 1, .36, 1)
                forwards;

            -webkit-mask-image:
                linear-gradient(
                    to right,
                    transparent 0%,
                    #000 8%,
                    #000 92%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to right,
                    transparent 0%,
                    #000 8%,
                    #000 92%,
                    transparent 100%
                );
        }


        .products-track {
            display: flex;
            align-items: center;

            gap: 20px;

            width: max-content;

            animation:
                productsScroll
                18s
                linear
                infinite;

            will-change: transform;
        }


        /* Pausa ao passar o mouse */

        .products-carousel:hover .products-track {
            animation-play-state: paused;
        }


        /* =========================================
           SOMENTE AS LOGOS
        ========================================= */

        .product-logo {
            width: 60px;
            height: 60px;

            flex: 0 0 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;
            box-shadow: none;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }


        .product-logo img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: transparent;

            border: none;
        }


        .product-logo:hover {
            transform: scale(1.12);
        }


        /* =========================================
           MOVIMENTO DO CARROSSEL
        ========================================= */

        @keyframes productsScroll {

            from {
                transform: translateX(0);
            }

            to {
                /*
                 * Temos duas sequências idênticas.
                 * Ao chegar à metade, começa novamente.
                 */

                transform:
                    translateX(calc(-50% - 10px));
            }

        }


        /* =========================================
           FORMULÁRIO
        ========================================= */

        .form {
            width: 100%;

            opacity: 0;
            transform: translateY(10px);

            animation:
                elementEnter
                0.6s
                0.24s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* =========================================
           CAMPO DE E-MAIL
        ========================================= */

        .input {
            display: block;

            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1px solid #d8d8d8;
            border-radius: 10px;

            background: #ffffff;
            color: #111111;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .input:hover {
            border-color: #bdbdbd;
        }

        .input:focus {
            border-color: #ff8200;

            box-shadow:
                0 0 0 3px
                rgba(255, 130, 0, 0.12);

            transform: translateY(-1px);
        }


        /* =========================================
           BOTÕES
        ========================================= */

        .button {
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 10px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                opacity 0.18s ease;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button:disabled {
            cursor: default;
            opacity: 0.75;
        }


        /* =========================================
           CONTINUAR
        ========================================= */

        .continue-button {
            margin-top: 12px;

            background: #ff8200;
            color: #ffffff;
        }

        .continue-button:hover {
            background: #ff9a30;
        }


        /* =========================================
           SPINNER DO BOTÃO
        ========================================= */

        .spinner {
            position: absolute;

            width: 19px;
            height: 19px;

            border:
                2px solid
                rgba(255, 255, 255, 0.35);

            border-top-color: #ffffff;

            border-radius: 50%;

            opacity: 0;
            visibility: hidden;

            /*
             * IMPORTANTE:
             * não gira enquanto o botão
             * não tiver a classe loading.
             */

            animation: none;
        }


        .continue-button.loading .spinner {
            opacity: 1;
            visibility: visible;

            animation:
                spin
                0.75s
                linear
                infinite;
        }


        .continue-button.loading .button-text {
            opacity: 0;
        }


        /* =========================================
           MENSAGEM
        ========================================= */

        .message {
            min-height: 20px;

            margin-top: 12px;

            color: #d00000;

            font-size: 13px;

            opacity: 0;

            transition:
                opacity 0.2s ease;
        }

        .message.show {
            opacity: 1;
        }


        /* =========================================
           DIVISOR
        ========================================= */

        .divider {
            display: flex;
            align-items: center;

            width: 100%;

            gap: 14px;

            margin: 24px 0;

            color: #999999;

            font-size: 13px;

            opacity: 0;

            animation:
                fadeIn
                0.5s
                0.30s
                forwards;
        }


        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #e5e5e5;
        }


        /* =========================================
           LOGIN SOCIAL
        ========================================= */

        .social-buttons {
            display: flex;
            flex-direction: column;

            width: 100%;

            gap: 10px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.6s
                0.34s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        .social-button {
            gap: 10px;
        }


        /* GOOGLE */

        #googleLogin {
            background: #ffffff;

            color: #202124;

            border: 1px solid #dadce0;
        }

        #googleLogin:hover {
            background: #f8f9fa;
        }


        /* FACEBOOK */

        #facebookLogin {
            background: #1877f2;

            color: #ffffff;
        }

        #facebookLogin:hover {
            background: #166fe5;
        }


        /* APPLE */

        #appleLogin {
            background: #000000;

            color: #ffffff;
        }

        #appleLogin:hover {
            background: #1c1c1c;
        }


        .social-icon {
            width: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            line-height: 1;
        }


        #googleLogin .social-icon {
            color: #4285f4;

            font-weight: 700;
        }


        #facebookLogin .social-icon {
            color: #ffffff;

            font-weight: 700;
        }


        /* =========================================
           CRIAR CONTA
        ========================================= */

        .create-account {
            display: inline-block;

            margin-top: 26px;

            color: #111111;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            opacity: 0;

            animation:
                fadeIn
                0.5s
                0.40s
                forwards;
        }


        .create-account:hover {
            color: #ff8200;

            text-decoration: underline;
        }


        /* =========================================
           RODAPÉ
        ========================================= */

        .footer {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 18px;

            margin-top: 38px;

            font-size: 12px;

            opacity: 0;

            animation:
                fadeIn
                0.5s
                0.46s
                forwards;
        }


        .footer a {
            color: #777777;

            text-decoration: none;
        }


        .footer a:hover {
            color: #111111;

            text-decoration: underline;
        }


        /* =========================================
           LOADING DA PÁGINA
        ========================================= */

        .page-loader {
            position: fixed;

            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffffff;

            z-index: 9999;

            pointer-events: none;

            animation:
                loaderOut
                0.35s
                0.35s
                forwards;
        }


        .loader-spinner {
            width: 26px;
            height: 26px;

            border: 3px solid #eeeeee;

            border-top-color: #ff8200;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }


        @keyframes loaderOut {

            to {
                opacity: 0;
                visibility: hidden;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding: 20px 18px;
            }

            .brand {
                font-size: 32px;
            }

            .description {
                max-width: 300px;

                font-size: 14px;
            }

            .product-logo {
                width: 56px;
                height: 56px;

                flex-basis: 56px;
            }

            .products-track {
                gap: 16px;

                animation-duration: 16s;
            }

            .footer {
                gap: 14px;

                margin-top: 32px;

                font-size: 11px;
            }

        }


        /* =========================================
           ACESSIBILIDADE
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING INICIAL
    ========================================= -->

    <div class="page-loader">
        <div class="loader-spinner"></div>
    </div>


    <main class="container">


        <!-- =========================================
             CONTA ONLINSIDE
        ========================================= -->

        <h1 class="brand">

            <span class="brand-conta">
                Conta
            </span>

            <span class="brand-onlinside">
                Onlinside
            </span>

        </h1>


        <!-- =========================================
             DESCRIÇÃO
        ========================================= -->

        <p class="description">
            Apenas uma única conta para todos os produtos Onlinside.
        </p>


        <!-- =========================================
             CARROSSEL DAS LOGOS
        ========================================= -->

        <div
            class="products-carousel"
            aria-label="Produtos Onlinside"
        >

            <div class="products-track">


                <!-- =================================
                     PRIMEIRO GRUPO
                ================================= -->


                <!-- ONE -->

                <div class="product-logo">

                    <img
                        src="./img/one.png"
                        alt="One"
                    >

                </div>


                <!-- ON360 -->

                <div class="product-logo">

                    <img
                        src="./img/on360.png"
                        alt="On360"
                    >

                </div>


                <!-- ONCAMARIM -->

                <div class="product-logo">

                    <img
                        src="./img/oncamarim.png"
                        alt="OnCamarim"
                    >

                </div>


                <!-- ON -->

                <div class="product-logo">

                    <img
                        src="./img/on.png"
                        alt="On"
                    >

                </div>


                <!-- MAISON -->

                <div class="product-logo">

                    <img
                        src="./img/maison.png"
                        alt="Maison"
                    >

                </div>


                <!-- JORNAL O PAIZ -->

                <div class="product-logo">

                    <img
                        src="./img/opaiz.png"
                        alt="Jornal O Paiz"
                    >

                </div>



                <!-- =================================
                     SEGUNDO GRUPO
                     CÓPIA PARA LOOP CONTÍNUO
                ================================= -->


                <!-- ONE -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/one.png"
                        alt=""
                    >

                </div>


                <!-- ON360 -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/on360.png"
                        alt=""
                    >

                </div>


                <!-- ONCAMARIM -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/oncamarim.png"
                        alt=""
                    >

                </div>


                <!-- ON -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/on.png"
                        alt=""
                    >

                </div>


                <!-- MAISON -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/maison.png"
                        alt=""
                    >

                </div>


                <!-- JORNAL O PAIZ -->

                <div
                    class="product-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./img/opaiz.png"
                        alt=""
                    >

                </div>


            </div>

        </div>


        <!-- =========================================
             LOGIN POR E-MAIL
        ========================================= -->

        <form
            id="loginForm"
            class="form"
        >

            <input
                type="email"
                id="email"
                class="input"
                placeholder="E-mail"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                class="button continue-button"
                id="continueButton"
            >

                <span class="button-text">
                    Continuar
                </span>

                <span
                    class="spinner"
                    aria-hidden="true"
                ></span>

            </button>

        </form>


        <!-- MENSAGEM -->

        <p
            id="mensagem"
            class="message"
        ></p>


        <!-- =========================================
             DIVISOR
        ========================================= -->

        <div class="divider">

            <span>
                ou
            </span>

        </div>


        <!-- =========================================
             LOGIN SOCIAL
        ========================================= -->

        <div class="social-buttons">


            <!-- GOOGLE -->

            <button
                type="button"
                class="button social-button"
                id="googleLogin"
            >

                <span class="social-icon">
                    G
                </span>

                Continuar com Google

            </button>


            <!-- FACEBOOK -->

            <button
                type="button"
                class="button social-button"
                id="facebookLogin"
            >

                <span class="social-icon">
                    f
                </span>

                Continuar com Facebook

            </button>


            <!-- APPLE -->

            <button
                type="button"
                class="button social-button"
                id="appleLogin"
            >

                <span class="social-icon">
                    
                </span>

                Continuar com Apple

            </button>


        </div>


        <!-- =========================================
             CRIAR CONTA
        ========================================= -->

        <a
            href="./cadastro.html"
            class="create-account"
        >

            Criar uma conta Onlinside

        </a>


        <!-- =========================================
             RODAPÉ
        ========================================= -->

        <footer class="footer">

            <a href="#">
                Política de Privacidade
            </a>

            <a href="#">
                Termos de Uso
            </a>

        </footer>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const continueButton =
            document.getElementById(
                "continueButton"
            );


        /* =========================================
           LOGIN POR E-MAIL
        ========================================= */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    emailInput
                        .value
                        .trim();


                mensagem.textContent = "";

                mensagem.classList.remove(
                    "show"
                );


                /* =================================
                   VERIFICA O E-MAIL
                ================================= */

                if (!email) {

                    mensagem.textContent =
                        "Digite seu e-mail.";

                    mensagem.classList.add(
                        "show"
                    );

                    emailInput.focus();

                    return;
                }


                /* Evita clique duplicado */

                if (continueButton.disabled) {
                    return;
                }


                /* =================================
                   LOADING DO BOTÃO
                ================================= */

                continueButton
                    .classList
                    .add(
                        "loading"
                    );


                continueButton.disabled =
                    true;


                /* =================================
                   SALVA O E-MAIL
                ================================= */

                localStorage.setItem(
                    "onlinside_email",
                    email
                );


                /* =================================
                   ABRE A PÁGINA DE SENHA
                ================================= */

                setTimeout(
                    function() {

                        document
                            .body
                            .classList
                            .add(
                                "page-exit"
                            );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "./senha.html";

                            },
                            280
                        );

                    },
                    350
                );

            }
        );


        /* =========================================
           CORRIGE O BOTÃO AO VOLTAR
        ========================================= */

        window.addEventListener(
            "pageshow",
            function() {

                continueButton
                    .classList
                    .remove(
                        "loading"
                    );


                continueButton.disabled =
                    false;


                document
                    .body
                    .classList
                    .remove(
                        "page-exit"
                    );

            }
        );


        /* =========================================
           VERIFICA SE AS LOGOS CARREGARAM
        ========================================= */

        document
            .querySelectorAll(
                ".product-logo img"
            )
            .forEach(
                function(img) {

                    img.addEventListener(
                        "error",
                        function() {

                            console.error(
                                "Não foi possível carregar:",
                                img.src
                            );

                        }
                    );

                }
            );
/* ========================================
   SALVA O SITE DE ORIGEM
======================================== */

const parametros =
    new URLSearchParams(window.location.search);

const returnUrl =
    parametros.get("return_url");


function returnUrlPermitida(url) {

    try {

        const destino =
            new URL(url);

        const dominiosPermitidos = [
            "onlinside.com",
            "www.onlinside.com",

            // Vamos adicionar aqui
            // os outros domínios da Onlinside.
        ];

        return dominiosPermitidos.includes(
            destino.hostname
        );

    } catch {

        return false;

    }
}


if (
    returnUrl &&
    returnUrlPermitida(returnUrl)
) {

    sessionStorage.setItem(
        "onlinside_return_url",
        returnUrl
    );

}
    </script>


</body>

</html>
