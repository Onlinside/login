<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirmar e-mail — Conta Onlinside</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: #ffffff;
            color: #111111;

            font-family: "Garet", Arial, sans-serif;

            opacity: 0;
            transform: translateY(8px);

            animation:
                pageEnter
                0.55s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* ==============================
           ANIMAÇÕES
        ============================== */

        @keyframes pageEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes elementEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.65;
                transform: scale(0.96);
            }
        }

        @keyframes successPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            70% {
                transform: scale(1.08);
                opacity: 1;
            }

            100% {
                transform: scale(1);
            }
        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {
            width: 100%;
            max-width: 420px;

            text-align: center;
        }


        /* ==============================
           MARCA
        ============================== */

        .brand {
            margin-bottom: 18px;

            font-size: 36px;
            line-height: 1.1;
            letter-spacing: -1px;

            opacity: 0;
            transform: translateY(10px);

            animation:
                elementEnter
                0.55s
                0.05s
                forwards;
        }

        .brand-conta {
            color: #ff9a30;
            font-weight: 400;
        }

        .brand-onlinside {
            color: #ff8200;
            font-weight: 800;
        }


        /* ==============================
           ÍCONE
        ============================== */

        .icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #fff2e4;
            color: #ff8200;

            font-size: 34px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.10s
                forwards;
        }


        /* ==============================
           TÍTULO
        ============================== */

        .title {
            margin-bottom: 10px;

            font-size: 27px;
            line-height: 1.2;
            letter-spacing: -0.4px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.14s
                forwards;
        }


        .description {
            color: #666666;

            font-size: 14px;
            line-height: 1.55;

            margin-bottom: 18px;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.18s
                forwards;
        }


        /* ==============================
           E-MAIL
        ============================== */

        .email-box {
            width: 100%;

            padding: 14px 16px;

            margin-bottom: 20px;

            border: 1px solid #eeeeee;
            border-radius: 12px;

            background: #fafafa;

            color: #333333;

            font-size: 14px;
            font-weight: 650;

            overflow-wrap: anywhere;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.22s
                forwards;
        }


        /* ==============================
           STATUS
        ============================== */

        .status-box {
            width: 100%;

            padding: 17px 18px;

            margin-bottom: 18px;

            border-radius: 14px;

            background: #fff7ef;

            color: #7b4c1c;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            font-size: 13px;
            font-weight: 650;

            opacity: 0;
            transform: translateY(8px);

            animation:
                elementEnter
                0.55s
                0.26s
                forwards;
        }


        .status-spinner {
            width: 17px;
            height: 17px;

            flex-shrink: 0;

            border:
                2px solid
                rgba(255, 130, 0, 0.20);

            border-top-color: #ff8200;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }


        .status-box.success {
            background: #eefaf1;
            color: #18753a;
        }


        .status-box.success
        .status-spinner {
            display: none;
        }


        .success-icon {
            display: none;

            width: 24px;
            height: 24px;

            border-radius: 50%;

            background: #22a447;
            color: #ffffff;

            justify-content: center;
            align-items: center;

            font-size: 14px;
            font-weight: 800;
        }


        .status-box.success
        .success-icon {
            display: flex;

            animation:
                successPop
                0.45s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }


        /* ==============================
           BOTÕES
        ============================== */

        .button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ff8200;
            color: #ffffff;

            font-family: inherit;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                opacity 0.2s ease;
        }


        .button:hover {
            background: #ff9a30;
            transform: translateY(-1px);
        }


        .button:disabled {
            opacity: 0.65;
            cursor: default;
            transform: none;
        }


        .secondary-button {
            background: #ffffff;
            color: #111111;

            border: 1px solid #dedede;
        }


        .secondary-button:hover {
            background: #f8f8f8;
        }


        /* ==============================
           TROCAR E-MAIL
        ============================== */

        .link-button {
            margin-top: 18px;

            border: 0;
            background: transparent;

            color: #ff8200;

            font-family: inherit;
            font-size: 13px;
            font-weight: 700;

            cursor: pointer;
        }


        .link-button:hover {
            text-decoration: underline;
        }


        /* ==============================
           CONTADOR
        ============================== */

        .countdown {
            min-height: 18px;

            margin-top: 9px;

            color: #888888;

            font-size: 12px;
        }


        /* ==============================
           MENSAGEM
        ============================== */

        .message {
            min-height: 20px;

            margin-top: 12px;

            color: #d00000;

            font-size: 13px;
        }


        .message.success {
            color: #16823b;
        }


        /* ==============================
           REDIRECIONAMENTO
        ============================== */

        .redirect-message {
            display: none;

            margin-top: 12px;

            color: #666666;

            font-size: 12px;

            animation:
                pulse
                1.4s
                ease-in-out
                infinite;
        }


        .redirect-message.show {
            display: block;
        }


        /* ==============================
           CELULAR
        ============================== */

        @media (max-width: 480px) {

            body {
                padding: 20px 18px;
            }

            .brand {
                font-size: 31px;
            }

            .title {
                font-size: 24px;
            }

            .icon {
                width: 70px;
                height: 70px;

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- MARCA -->

        <h1 class="brand">

            <span class="brand-conta">
                Conta
            </span>

            <span class="brand-onlinside">
                Onlinside
            </span>

        </h1>


        <!-- ÍCONE -->

        <div class="icon">
            ✉
        </div>


        <!-- TÍTULO -->

        <h2 class="title">
            Confirme seu e-mail
        </h2>


        <p class="description">

            Enviamos um link de confirmação para o endereço abaixo.
            Abra o e-mail e confirme sua Conta Onlinside.

        </p>


        <!-- E-MAIL -->

        <div
            id="emailDisplay"
            class="email-box"
        >
            Carregando...
        </div>


        <!-- STATUS AUTOMÁTICO -->

        <div
            id="statusBox"
            class="status-box"
        >

            <span
                class="status-spinner"
                aria-hidden="true"
            ></span>

            <span
                class="success-icon"
                aria-hidden="true"
            >
                ✓
            </span>

            <span id="statusText">
                Aguardando confirmação do e-mail...
            </span>

        </div>


        <!-- REENVIAR -->

        <button
            type="button"
            id="resendButton"
            class="button secondary-button"
        >
            Reenviar e-mail de confirmação
        </button>


        <!-- CONTADOR -->

        <p
            id="countdown"
            class="countdown"
        ></p>


        <!-- TROCAR E-MAIL -->

        <button
            type="button"
            id="changeEmailButton"
            class="link-button"
        >
            Trocar endereço de e-mail
        </button>


        <!-- MENSAGEM -->

        <p
            id="mensagem"
            class="message"
        ></p>


        <p
            id="redirectMessage"
            class="redirect-message"
        >
            Redirecionando...
        </p>


    </main>


    <script type="module">

        import { auth }
        from "./firebase.js";


        import {
            onAuthStateChanged,
            reload,
            sendEmailVerification,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /* ========================================
           ELEMENTOS
        ======================================== */

        const emailDisplay =
            document.getElementById(
                "emailDisplay"
            );


        const resendButton =
            document.getElementById(
                "resendButton"
            );


        const changeEmailButton =
            document.getElementById(
                "changeEmailButton"
            );


        const mensagem =
            document.getElementById(
                "mensagem"
            );


        const countdown =
            document.getElementById(
                "countdown"
            );


        const statusBox =
            document.getElementById(
                "statusBox"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const redirectMessage =
            document.getElementById(
                "redirectMessage"
            );


        let currentUser = null;

        let verificationTimer = null;

        let resendTimer = null;

        let verificationFinished = false;


        /* ========================================
           DESTINO APÓS CONFIRMAÇÃO
        ======================================== */

        function getDestination() {

            /*
             * Se futuramente o login vier
             * de um produto Onlinside,
             * salve a página aqui:
             *
             * sessionStorage.setItem(
             *   "onlinside_return_url",
             *   "ENDEREÇO"
             * );
             */

            const returnUrl =
                sessionStorage.getItem(
                    "onlinside_return_url"
                );


            if (returnUrl) {

                sessionStorage.removeItem(
                    "onlinside_return_url"
                );

                return returnUrl;
            }


            /*
             * Sem destino salvo:
             * vai para Minha Conta.
             */

            return "./minha-conta.html";

        }


        /* ========================================
           USUÁRIO FIREBASE
        ======================================== */

        onAuthStateChanged(
            auth,
            function(usuario) {

                if (!usuario) {

                    window.location.href =
                        "./index.html";

                    return;
                }


                currentUser =
                    usuario;


                emailDisplay.textContent =
                    usuario.email ||
                    "E-mail não disponível";


                /*
                 * Pode acontecer de a página
                 * abrir quando o usuário já
                 * confirmou o e-mail.
                 */

                if (
                    usuario.emailVerified
                ) {

                    finishVerification();

                    return;
                }


                startVerificationWatcher();

            }
        );


        /* ========================================
           MONITORAMENTO AUTOMÁTICO
        ======================================== */

        function startVerificationWatcher() {

            clearInterval(
                verificationTimer
            );


            /*
             * Faz uma verificação imediatamente,
             * sem esperar os primeiros 3 segundos.
             */

            checkVerification();


            /*
             * Depois verifica novamente
             * a cada 3 segundos.
             */

            verificationTimer =
                setInterval(
                    checkVerification,
                    3000
                );

        }


        async function checkVerification() {

            if (
                !currentUser ||
                verificationFinished
            ) {

                return;
            }


            try {

                /*
                 * Busca novamente os dados
                 * do usuário no Firebase.
                 */

                await reload(
                    currentUser
                );


                if (
                    currentUser.emailVerified
                ) {

                    finishVerification();

                }

            } catch (erro) {

                /*
                 * Não precisamos interromper
                 * a tela por um erro temporário.
                 * O próximo ciclo tenta novamente.
                 */

                console.error(
                    "Erro ao consultar confirmação:",
                    erro
                );

            }

        }


        /* ========================================
           CONFIRMAÇÃO DETECTADA
        ======================================== */

        function finishVerification() {

            if (verificationFinished) {
                return;
            }


            verificationFinished =
                true;


            clearInterval(
                verificationTimer
            );


            clearInterval(
                resendTimer
            );


            statusBox.classList.add(
                "success"
            );


            statusText.textContent =
                "E-mail confirmado com sucesso!";


            mensagem.textContent =
                "";


            countdown.textContent =
                "";


            resendButton.disabled =
                true;


            changeEmailButton.disabled =
                true;


            redirectMessage.classList.add(
                "show"
            );


            /*
             * Dá tempo para a pessoa
             * perceber a confirmação.
             */

            setTimeout(
                function() {

                    window.location.href =
                        getDestination();

                },
                1300
            );

        }


        /* ========================================
           REENVIAR VERIFICAÇÃO
        ======================================== */

        resendButton.addEventListener(
            "click",
            async function() {

                if (
                    !currentUser ||
                    verificationFinished
                ) {

                    return;
                }


                mensagem.textContent =
                    "";

                mensagem.className =
                    "message";


                resendButton.disabled =
                    true;


                try {

                    await sendEmailVerification(
                        currentUser
                    );


                    mensagem.textContent =
                        "Novo e-mail de confirmação enviado.";

                    mensagem.classList.add(
                        "success"
                    );


                    startCountdown();


                } catch (erro) {

                    console.error(
                        erro
                    );


                    mensagem.textContent =
                        "Não foi possível reenviar o e-mail agora.";


                    resendButton.disabled =
                        false;

                }

            }
        );


        /* ========================================
           CONTADOR DO REENVIO
        ======================================== */

        function startCountdown() {

            let seconds =
                60;


            clearInterval(
                resendTimer
            );


            countdown.textContent =
                "Você poderá reenviar em " +
                seconds +
                "s";


            resendTimer =
                setInterval(
                    function() {

                        seconds--;


                        if (
                            seconds <= 0
                        ) {

                            clearInterval(
                                resendTimer
                            );


                            countdown.textContent =
                                "";


                            if (
                                !verificationFinished
                            ) {

                                resendButton.disabled =
                                    false;
                            }


                            return;
                        }


                        countdown.textContent =
                            "Você poderá reenviar em " +
                            seconds +
                            "s";


                    },
                    1000
                );

        }


        /* ========================================
           TROCAR E-MAIL
        ======================================== */

        changeEmailButton.addEventListener(
            "click",
            async function() {

                clearInterval(
                    verificationTimer
                );


                clearInterval(
                    resendTimer
                );


                try {

                    await signOut(
                        auth
                    );


                    window.location.href =
                        "./cadastro.html";


                } catch (erro) {

                    console.error(
                        erro
                    );


                    mensagem.textContent =
                        "Não foi possível voltar para o cadastro.";

                }

            }
        );


        /* ========================================
           PARA OS TIMERS AO SAIR
        ======================================== */

        window.addEventListener(
            "beforeunload",
            function() {

                clearInterval(
                    verificationTimer
                );


                clearInterval(
                    resendTimer
                );

            }
        );

    </script>


</body>

</html>
