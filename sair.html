<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sair — Conta Onlinside</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background: #ffffff;

            color: #111111;

            font-family:
                "Garet",
                Arial,
                sans-serif;

            opacity: 0;

            transform:
                translateY(8px);

            animation:
                pageEnter
                .55s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }


        @keyframes pageEnter {

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 470px;

            text-align: center;
        }


        /* =========================================
           CONTA ONLINSIDE
        ========================================= */

        .brand {

            margin-bottom: 14px;

            font-size: 37px;

            line-height: 1;

            letter-spacing: -1px;
        }


        .brand-conta {

            color: #ff9a30;

            font-weight: 400;
        }


        .brand-onlinside {

            color: #ff8200;

            font-weight: 800;
        }


        /* =========================================
           CARROSSEL
        ========================================= */

        .products-carousel {

            position: relative;

            width: 100%;

            overflow: hidden;

            margin-bottom: 28px;

            padding: 14px 0;
        }


        /*
         * Degradê nas laterais.
         */

        .products-carousel::before,
        .products-carousel::after {

            content: "";

            position: absolute;

            top: 0;

            width: 65px;

            height: 100%;

            z-index: 3;

            pointer-events: none;
        }


        .products-carousel::before {

            left: 0;

            background:
                linear-gradient(
                    to right,
                    #ffffff 10%,
                    rgba(255,255,255,0)
                );
        }


        .products-carousel::after {

            right: 0;

            background:
                linear-gradient(
                    to left,
                    #ffffff 10%,
                    rgba(255,255,255,0)
                );
        }


        .carousel-track {

            display: flex;

            align-items: center;

            gap: 22px;

            width: max-content;

            animation:
                moverProdutos
                20s
                linear
                infinite;
        }


        @keyframes moverProdutos {

            from {

                transform:
                    translateX(0);

            }

            to {

                transform:
                    translateX(-50%);

            }

        }


        .produto-logo {

            width: 68px;
            height: 68px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .produto-logo img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /*
         * Nome alternativo caso alguma
         * imagem não carregue.
         */

        .produto-fallback {

            display: none;

            font-size: 12px;

            font-weight: 700;
        }


        /* =========================================
           PERGUNTA
        ========================================= */

        .title {

            max-width: 410px;

            margin:
                0 auto 28px;

            font-size: 27px;

            line-height: 1.25;

            letter-spacing: -.6px;
        }


        /* =========================================
           BOTÕES
        ========================================= */

        .actions {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .button {

            position: relative;

            width: 100%;

            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease,
                opacity .2s ease;
        }


        .button:hover {

            transform:
                translateY(-1px);
        }


        .button:disabled {

            cursor: default;

            opacity: .65;

            transform: none;
        }


        /* SAIR */

        .logout-button {

            border: none;

            background: #ff8200;

            color: #ffffff;
        }


        .logout-button:hover {

            background: #ff9a30;
        }


        /* CANCELAR */

        .cancel-button {

            border:
                1px solid #e3e3e3;

            background: #ffffff;

            color: #111111;
        }


        .cancel-button:hover {

            background: #f7f7f7;

            border-color: #d8d8d8;
        }


        /* =========================================
           FINALIZANDO SAÍDA
        ========================================= */

        .logout-overlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .3s ease,
                visibility .3s ease;
        }


        .logout-overlay.active {

            opacity: 1;

            visibility: visible;
        }


        .logout-overlay-brand {

            font-size: 37px;

            letter-spacing: -1px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {

                padding:
                    20px 18px;
            }


            .brand,
            .logout-overlay-brand {

                font-size: 31px;
            }


            .title {

                font-size: 24px;
            }


            .produto-logo {

                width: 60px;
                height: 60px;
            }

        }


        @media (
            prefers-reduced-motion:
            reduce
        ) {

            .carousel-track {

                animation: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TELA PRINCIPAL
    ========================================== -->

    <main class="container">


        <!-- CONTA ONLINSIDE -->

        <div class="brand">

            <span class="brand-conta">
                Conta
            </span>

            <span class="brand-onlinside">
                Onlinside
            </span>

        </div>



        <!-- =========================================
             CARROSSEL
        ========================================== -->

        <div
            class="products-carousel"
            aria-label="Produtos Onlinside"
        >

            <div class="carousel-track">


                <!-- PRIMEIRA SEQUÊNCIA -->


                <!-- ONE -->

                <div class="produto-logo">

                    <img
                        src="./imagem/one.png"
                        alt="One"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        One
                    </span>

                </div>



                <!-- ON360 -->

                <div class="produto-logo">

                    <img
                        src="./imagem/on360.png"
                        alt="On360"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        On360
                    </span>

                </div>



                <!-- ONCAMARIM -->

                <div class="produto-logo">

                    <img
                        src="./imagem/oncamarim.png"
                        alt="OnCamarim"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        OnCamarim
                    </span>

                </div>



                <!-- ON -->

                <div class="produto-logo">

                    <img
                        src="./imagem/on.png"
                        alt="On"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        On
                    </span>

                </div>



                <!-- MAISON -->

                <div class="produto-logo">

                    <img
                        src="./imagem/maison.png"
                        alt="Maison"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        Maison
                    </span>

                </div>



                <!-- O PAIZ -->

                <div class="produto-logo">

                    <img
                        src="./imagem/opaiz.png"
                        alt="O Paiz"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span class="produto-fallback">
                        O Paiz
                    </span>

                </div>



                <!-- =================================
                     REPETIÇÃO PARA LOOP CONTÍNUO
                ================================== -->


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/one.png"
                        alt=""
                    >

                </div>


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/on360.png"
                        alt=""
                    >

                </div>


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/oncamarim.png"
                        alt=""
                    >

                </div>


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/on.png"
                        alt=""
                    >

                </div>


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/maison.png"
                        alt=""
                    >

                </div>


                <div
                    class="produto-logo"
                    aria-hidden="true"
                >

                    <img
                        src="./imagem/opaiz.png"
                        alt=""
                    >

                </div>


            </div>

        </div>



        <!-- =========================================
             PERGUNTA
        ========================================== -->

        <h1 class="title">

            Você realmente quer sair da sua Conta Onlinside?

        </h1>



        <!-- =========================================
             AÇÕES
        ========================================== -->

        <div class="actions">


            <button
                type="button"
                id="confirmarSair"
                class="button logout-button"
            >
                Sair
            </button>


            <button
                type="button"
                id="cancelar"
                class="button cancel-button"
            >
                Cancelar
            </button>


        </div>


    </main>



    <!-- =========================================
         TELA ENQUANTO ENCERRA AS SESSÕES
    ========================================== -->

    <div
        class="logout-overlay"
        id="logoutOverlay"
    >

        <div class="logout-overlay-brand">

            <span class="brand-conta">
                Conta
            </span>

            <span class="brand-onlinside">
                Onlinside
            </span>

        </div>

    </div>



    <!-- =========================================
         FIREBASE + LOGOUT
    ========================================== -->

    <script type="module">


        /* =========================================
           FIREBASE
        ========================================= */

        import { auth }
        from "./firebase.js";


        import {
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



        /* =========================================
           CONFIGURAÇÕES
        ========================================= */

        const WORDPRESS_URL =
            "https://samueldesousasantos1785619701880.1161322.meusitehostgator.com.br";


        const SAIR_URL =
            "https://onlinside.github.io/login/sair.html";


        const SITE_PADRAO =
            WORDPRESS_URL + "/";



        /* =========================================
           ELEMENTOS
        ========================================= */

        const confirmarSair =
            document.getElementById(
                "confirmarSair"
            );


        const cancelar =
            document.getElementById(
                "cancelar"
            );


        const logoutOverlay =
            document.getElementById(
                "logoutOverlay"
            );



        /* =========================================
           PARÂMETROS DA URL
        ========================================= */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const logoutWordPress =
            parametros.get(
                "logout"
            );


        const retornoRecebido =
            parametros.get(
                "return_url"
            );



        /* =========================================
           VALIDA URL DE RETORNO
        ========================================= */

        function obterUrlRetorno() {


            if (!retornoRecebido) {

                return SITE_PADRAO;

            }


            try {

                const url =
                    new URL(
                        retornoRecebido
                    );


                /*
                 * Endereços permitidos.
                 *
                 * O domínio principal já fica
                 * preparado para quando sair do teste.
                 */

                const hostsPermitidos = [

                    "samueldesousasantos1785619701880.1161322.meusitehostgator.com.br",

                    "onlinside.com",

                    "www.onlinside.com"

                ];


                if (
                    url.protocol !==
                    "https:"
                ) {

                    return SITE_PADRAO;

                }


                if (
                    !hostsPermitidos.includes(
                        url.hostname
                    )
                ) {

                    return SITE_PADRAO;

                }


                return url.href;


            } catch (erro) {

                return SITE_PADRAO;

            }

        }


        const returnUrl =
            obterUrlRetorno();



        /* =========================================
           CANCELAR
        ========================================= */

        cancelar.addEventListener(
            "click",
            function () {


                /*
                 * Volta para a página exata
                 * onde a pessoa estava.
                 */

                window.location.href =
                    returnUrl;

            }
        );



        /* =========================================
           USUÁRIO CONFIRMOU SAÍDA
        ========================================= */

        confirmarSair.addEventListener(
            "click",
            function () {


                confirmarSair.disabled =
                    true;


                cancelar.disabled =
                    true;


                confirmarSair.textContent =
                    "Saindo...";


                logoutOverlay.classList.add(
                    "active"
                );


                /*
                 * =================================
                 * URL PARA VOLTAR AO GITHUB
                 * DEPOIS DO WORDPRESS APAGAR
                 * O COOKIE.
                 * =================================
                 */

                const callback =
                    new URL(
                        SAIR_URL
                    );


                callback.searchParams.set(
                    "logout",
                    "wordpress"
                );


                callback.searchParams.set(
                    "return_url",
                    returnUrl
                );



                /*
                 * =================================
                 * CHAMA O ENDPOINT QUE ACABAMOS
                 * DE CRIAR NO PLUGIN WORDPRESS.
                 * =================================
                 */

                const wordpressLogout =
                    new URL(
                        WORDPRESS_URL +
                        "/wp-admin/admin-post.php"
                    );


                wordpressLogout.searchParams.set(
                    "action",
                    "onlinside_sso_logout"
                );


                wordpressLogout.searchParams.set(
                    "return_url",
                    callback.toString()
                );


                /*
                 * Navegação principal.
                 *
                 * Isso permite ao WordPress
                 * receber e apagar o próprio cookie.
                 */

                window.location.href =
                    wordpressLogout.toString();

            }
        );



        /* =========================================
           VOLTOU DO WORDPRESS
        ========================================= */

        async function finalizarLogout() {


            if (
                logoutWordPress !==
                "wordpress"
            ) {

                return;

            }


            /*
             * Esconde a tela de confirmação.
             */

            logoutOverlay.classList.add(
                "active"
            );


            confirmarSair.disabled =
                true;


            cancelar.disabled =
                true;


            try {


                /*
                 * =================================
                 * ENCERRA FIREBASE
                 * =================================
                 */

                await signOut(
                    auth
                );


            } catch (erro) {


                console.error(
                    "Erro ao encerrar Firebase:",
                    erro
                );


            } finally {


                /*
                 * =================================
                 * LIMPA DADOS LOCAIS
                 * =================================
                 */

                localStorage.removeItem(
                    "onlinside_email"
                );


                localStorage.removeItem(
                    "onlinside_nome"
                );


                localStorage.removeItem(
                    "onlinside_birthdate"
                );


                localStorage.removeItem(
                    "onlinside_public_id"
                );


                /*
                 * =================================
                 * VOLTA PARA O SITE
                 * =================================
                 */

                window.location.replace(
                    returnUrl
                );

            }

        }



        /* =========================================
           INICIAR
        ========================================= */

        finalizarLogout();


    </script>


</body>

</html>
