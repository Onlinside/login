<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conta Onlinside</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

       body {
    min-height: 100vh;
    width: 100%;

    background: #ffffff;
    font-family: "Garet", Arial, sans-serif;
    color: #111111;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

        .container {
            width: 100%;
            max-width: 430px;

            margin: 0 auto;
            
            text-align: center;
        }

        .brand {
            font-size: 38px;
            line-height: 1.1;
            margin-bottom: 14px;
            letter-spacing: -1.2px;
        }

        .brand-conta {
            color: #ff9a30;
            font-weight: 400;
        }

        .brand-onlinside {
            color: #ff8200;
            font-weight: 800;
        }

        .description {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 auto 34px;
            max-width: 330px;
        }

        .form {
            width: 100%;
        }

        .input {
            width: 100%;
            height: 52px;

            border: 1px solid #d8d8d8;
            border-radius: 10px;

            padding: 0 16px;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input:focus {
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.07);
        }

        .button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            background: #000000;
            color: #ffffff;

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: transform 0.15s, opacity 0.15s;
        }

        .button:hover {
            opacity: 0.88;
        }

        .button:active {
            transform: scale(0.99);
        }

        .continue-button {
            margin-top: 12px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;

            margin: 28px 0;
            
            color: #999999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-button {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .social-icon {
            font-size: 18px;
            line-height: 1;
        }

        .create-account {
            display: inline-block;

            margin-top: 28px;

            color: #111111;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;
        }

        .create-account:hover {
            text-decoration: underline;
        }

        .message {
            min-height: 20px;

            margin-top: 14px;

            color: #d00000;
            font-size: 13px;
        }

        .footer {
            margin-top: 42px;

            display: flex;
            justify-content: center;
            gap: 18px;

            font-size: 12px;
        }

        .footer a {
            color: #777777;
            text-decoration: none;
        }

        .footer a:hover {
            color: #111111;
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            body {
                padding: 24px 18px;
    
            }

            .brand {
                font-size: 32px;
            }

            .description {
                font-size: 14px;
                margin-bottom: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="brand">
            <span class="brand-conta">Conta</span>
            <span class="brand-onlinside">Onlinside</span>
        </h1>

        <p class="description">
            Apenas uma única conta para todos os produtos Onlinside.
        </p>


        <form id="loginForm" class="form">

            <input
                type="email"
                id="email"
                class="input"
                placeholder="E-mail"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                class="button continue-button"
            >
                Continuar
            </button>

        </form>


        <p id="mensagem" class="message"></p>


        <div class="divider">
            <span>ou</span>
        </div>


        <div class="social-buttons">

            <button
                type="button"
                class="button social-button"
                id="googleLogin"
            >
                <span class="social-icon">G</span>
                Continuar com Google
            </button>


            <button
                type="button"
                class="button social-button"
                id="facebookLogin"
            >
                <span class="social-icon">f</span>
                Continuar com Facebook
            </button>


            <button
                type="button"
                class="button social-button"
                id="appleLogin"
            >
                <span class="social-icon"></span>
                Continuar com Apple
            </button>

        </div>


        <a
            href="cadastro.html"
            class="create-account"
        >
            Criar uma conta Onlinside
        </a>


        <footer class="footer">

            <a href="#">
                Política de Privacidade
            </a>

            <a href="#">
                Termos de Uso
            </a>

        </footer>

    </main>


    <!--
        IMPORTANTE:

        A lógica do Firebase será adicionada
        novamente depois que confirmarmos
        que o novo visual está funcionando.

        Não configuramos Google, Facebook e Apple
        aqui ainda.
    -->


</body>
</html>
